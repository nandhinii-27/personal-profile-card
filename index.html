
<!DOCTYPE html>
<html>
<head>
    <title>Personal Profile Card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Main Profile Card -->
    
<input type="checkbox" id="flip">
<label for="flip" class="profile-card">

    <div class="card-inner">

        <!-- FRONT SIDE -->
        <div class="card-front">

            <img src="profile.jpg" alt="Profile Picture" class="profile-img">

            <h2>Nandhini I</h2>

            <p>
                Hi! I'm a Computer Science student passionate
                about technology, programming and web development.
            </p>

            <div class="social-links">

            <a href="https://github.com/nandhinii-27" target="_blank">
                <img src="github.png" alt="GitHub">
            </a>

            <a href="https://www.linkedin.com/in/nandhini-i/" target="_blank">
                <img src="linkedin.png" alt="LinkedIn">
            </a>

            <a href="https://codolio.com/profile/nandhinii03" target="_blank">
                <img src="codolio.png" alt="Codolio">
            </a>

            </div>

            <p class="hint">Click to flip!</p>

        </div>

        <!-- BACK SIDE -->
        <div class="card-back">
            <img src="profile.jpg" alt="Full Profile Picture">
            <h2>Nandhini I</h2>
            <p>Thanks for visiting my profile!</p>
        </div>

    </div>

</label>


</label>


</body>
</html>
